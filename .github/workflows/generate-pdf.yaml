name: Generate PDF Documentation

on:
  push:
    branches:
      - develop
    paths:
      - 'doc/source/**'
      - 'doc/Makefile'
      - '.github/workflows/generate-pdf.yaml'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme
        if [ -f doc/requirements.txt ]; then
          pip install -r doc/requirements.txt
        fi

    - name: Install LaTeX (for PDF generation)
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended

    - name: Generate PDF
      run: |
        cd doc
        make clean
        make latexpdf

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: pdf-documentation
        path: doc/build/latex/*.pdf
        retention-days: 30

    - name: Commit and push PDF (optional)
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: |
        cd doc
        mkdir -p ../pdfs
        cp build/latex/*.pdf ../pdfs/ 2>/dev/null || true
        cd ..
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        if [ -n "$(git status --porcelain)" ]; then
          git add pdfs/
          git commit -m "docs: update PDF documentation [skip ci]"
          git push
        fi
